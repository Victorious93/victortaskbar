name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint (optional)
        run: ./gradlew lintDebug
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: victortaskbar-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  root-module:
    # OPTIONAL Magisk / KernelSU / APatch module. Builds the debug APK, packages it into
    # victortaskbar-root-module-<version>.zip, validates the zip and uploads it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Shellcheck module and scripts
        run: |
          shellcheck --version
          shellcheck -s sh module/customize.sh module/META-INF/com/google/android/update-binary
          shellcheck scripts/build-module.sh scripts/check-module-zip.sh
      - name: Build debug APK and module zip
        run: scripts/build-module.sh
      - name: Validate module zip layout
        run: scripts/check-module-zip.sh build/module/victortaskbar-root-module-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: victortaskbar-root-module
          path: build/module/victortaskbar-root-module-*.zip
          if-no-files-found: error
